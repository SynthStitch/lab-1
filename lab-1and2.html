<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      img {
        display: block;
        margin: 20px auto;
        width: 100%;
        max-width: 500px;
        margin-top: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      table {
        width: 80%;
        border-collapse: collapse;
        margin: 20px auto;
      }
      th, td {
        display: table-cell;
        padding: 8px;
        text-align: center;
        background-color: #f9f9f9;
        padding: 10px;
        text-align: left;
      }
      form {
        margin: 20px auto;
        text-align: center;
        max-width: 500px;
        padding: 20px;
        border-radius: 8px;
        background-color: #ffa0a0;
      }

    </style>
  </head>
  <body>
    <h1>Module 1 screenshot:</h1>
    <img src="Screenshot 2025-06-26 173922.png" alt="Module 1 screenshot" />
    <table border="11">
      <tr>
        <th>Row 1 column 1</th>
        <th>Row 1 column 2</th>
      </tr>
      <tr>
        <td>Data 1</td>
        <td>Data 2</td>
      </tr>
    </table>
      <form action="/action_page">  
        <div>  
            <label for="fname">First name:</label>

            <input type="text" name="fname" value="Input here">
            <input type="submit" value="Submit">
        </div>
        <div>  
            <label for="lname">Last name:</label>

            <input type="text" name="lname" value="Input here">
            <input type="submit" value="Submit">
      </form>
  </body>
</html>

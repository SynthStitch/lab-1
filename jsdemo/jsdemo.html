<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="demo">JavaScript can change the style of an HTML element.</p>
    <script>
      document.getElementById("demo").style.color = "red";
      document.getElementById("demo").style.fontSize = "20px";
      document.getElementById("demo").style.fontFamily = "Arial, sans-serif";
      document.getElementById("demo").style.backgroundColor = "lightblue";
      document.getElementById("demo").style.padding = "10px";
      document.getElementById("demo").style.border = "2px solid black";
    </script>
  </body>
</html>

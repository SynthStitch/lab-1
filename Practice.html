<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="header">Hello world!!</h1></br>
    <button onclick="ChangeColor()">Change Color</button>
    <section>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="Shirts">Shirts</a></li>
          <li><a href="Pants">Pants</a></li>
          <li><a href="Shoes">Shoes</a></li>
        </ul>
      </nav>
      <article>
        <h1>Welcome to My Page</h1>
        <p>Garments:</p>
        <img width="300" src="https://www.houseofblanks.com/cdn/shop/files/HeavyweightTshirt_Natural_01_1.jpg?v=1726516460&width=1946" alt="Shirt" /> <br />
        <a href="https://google.com">more info</a>
      </article>
      <section>
        <form>
          <!-- two lines for address City State Zip -->
            <label for="Address1">Address 1:</label>
            <input type="text" id="Address1" name="Address1" placeholder="Enter Address 1"><br>
            <label for="Address2">Address 2:</label>
            <input type="text" id="Address2" name="Address2" placeholder="Enter Address 2"><br>
            <label for="City">City:</label>
            <input type="text" id="City" name="City" placeholder="Enter City"><br>
            <label for="State">State:</label>
            <input type="text" id="State" name="State" placeholder="Enter State"><br>
            <label for="Zip">Zip:</label>
            <input type="number" id="Zip" name="Zip" placeholder="Enter Zip"><br>

            <button onclick="SubmitOrder()">Submit</button>
        </form>
      </section>
      <aside id="aside">
        <h2>Related Links</h2>
        <ul>
          <li><a href="#">Article 1 </a></li>
          <li><a href="#">Article 2</a></li>
          <li><a href="#">Article 3</a></li>
        </ul>
      </aside>
      <footer>
        <p>©copyright 2077 by everyone. All rights reserved</p>
    </section>
    <script>
      // Create a button that creates the header to red, the sidebar to yellow, related to blue
      function SubmitOrder() {
        alert('Your order will be shipped soon.');
      }
      function ChangeColor() {
        document.getElementById("header").style.backgroundColor = "red";
        document.getElementById("aside").style.backgroundColor = "yellow";
        document.querySelector("article").style.backgroundColor = "blue";
      }
      document.getElementById("header").innerText ='Hello JavaScript';
      // document.getElementById("aside").style.backgroundColor = 'green';
</script>
    </script>
  </body>
</html>
